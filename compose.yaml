services:
  postgres:
    image: 'postgres:latest'
    restart: 'always'
    environment:
      - 'POSTGRES_DB=account_reservation'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256'
      - 'PGDATA=/var/lib/postgresql/data'
    ports:
      - '5432:5432'