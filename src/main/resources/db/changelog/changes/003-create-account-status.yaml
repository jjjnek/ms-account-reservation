databaseChangeLog:
  - changeSet:
      id: 003
      author: admin

      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: account_status

      changes:
        - createTable:
            tableName: account_status
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(300)