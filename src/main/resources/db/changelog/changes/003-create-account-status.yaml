databaseChangeLog:
  - changeSet:
      id: 003
      author: admin
      changes:
        - createTable:
            tableName: account_status
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
              - column:
                  name: description
                  type: VARCHAR(300)

